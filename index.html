<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14161c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Python Quest</title>
<style>
:root{
  --bg:#f5f6f8;--card:#fff;--text:#1b1d22;--muted:#6b7080;--line:#e2e4ea;
  --accent:#3b6fe0;--ok:#1f9d55;--okbg:#e6f6ec;--bad:#d64545;--badbg:#fdeaea;
  --code:#f0f2f6;--codetext:#1b1d22;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#14161c;--card:#1d2028;--text:#e8eaf0;--muted:#9097a8;--line:#2c303b;
    --accent:#6b95ff;--ok:#4cc77f;--okbg:#17301f;--bad:#ff6b6b;--badbg:#3a1d1d;
    --code:#111318;--codetext:#e8eaf0;}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.5 -apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer}
#app{max-width:640px;margin:0 auto;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-size:24px;margin:8px 0}
h2{font-size:19px;margin:8px 0 12px;line-height:1.35}
.xp{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px;margin:8px 0 4px}
.tab{flex:1;border:0;background:none;border-radius:9px;padding:10px 6px;font-weight:600;color:var(--muted);min-height:44px}
.tab.on{background:var(--accent);color:#fff}
.lead{color:var(--muted);margin:4px 0 16px}
.blocks{display:flex;flex-direction:column;gap:10px}
.block{display:flex;align-items:center;gap:12px;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:14px;padding:14px;width:100%}
.block .num{font-weight:700;color:var(--accent);font-size:18px;min-width:26px}
.block .bt{flex:1;display:flex;flex-direction:column}
.block small{color:var(--muted);font-size:13px;line-height:1.35}
.block .score{font-weight:700;color:var(--ok);white-space:nowrap}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;background:var(--accent);
  color:#fff;font-weight:600;margin-top:14px;min-height:50px}
.btn:disabled{opacity:.4}
.btn.ghost{background:var(--card);color:var(--text);border:1px solid var(--line)}
.review{margin:0 0 16px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qhead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 0;color:var(--muted)}
.link{background:none;border:0;font-size:22px;padding:4px 8px;color:var(--muted)}
.kind{color:var(--accent);font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.04em;margin:8px 0 0}
pre{background:var(--code);color:var(--codetext);border:1px solid var(--line);border-radius:10px;
  padding:12px;overflow-x:auto;font-size:14px;line-height:1.5;margin:0 0 12px}
code{font-family:"JetBrains Mono",Consolas,Menlo,monospace;font-size:.92em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt,.chip{text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;min-height:52px;width:100%}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.built,.pool{display:flex;flex-direction:column;gap:6px}
.built{min-height:60px;border:1.5px dashed var(--line);border-radius:12px;padding:6px;margin-bottom:12px}
.chip{min-height:44px;padding:8px 12px;white-space:pre;overflow-x:auto;font-family:"JetBrains Mono",Consolas,Menlo,monospace;font-size:13px}
.built .chip{border-color:var(--accent)}
.built.ok{border-color:var(--ok);background:var(--okbg)}
.built.bad{border-color:var(--bad);background:var(--badbg)}
.fb{margin-top:14px;border-radius:12px;padding:12px 14px;border:1px solid var(--line);background:var(--card)}
.fb b.ok{color:var(--ok)} .fb b.bad{color:var(--bad)}
.fb p{margin:6px 0 0}
.gloss{width:100%;border-collapse:collapse;margin-top:8px;font-size:15px}
.gloss td{border-top:1px solid var(--line);padding:8px 4px;vertical-align:top}
.gloss td:first-child{font-weight:600;white-space:nowrap;padding-right:12px}
.big{font-size:44px;text-align:center;margin:20px 0 0}
.center{text-align:center}
.muted{color:var(--muted)}
@media (hover:hover){.opt:not(:disabled):hover,.block:hover,.chip:hover{border-color:var(--accent)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="course.js"></script>
<script src="app.js"></script>
</body>
</html>
